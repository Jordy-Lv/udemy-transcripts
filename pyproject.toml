[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "udemy-transcripts"
version = "1.1.0"
description = "Descarga las transcripciones de los cursos de Udemy (personal y Business)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["playwright"]

[project.optional-dependencies]
dev = ["pytest", "pyyaml"]
ai = ["anthropic"]

[project.scripts]
udemy = "udemy_transcripts.cli:main"

[tool.setuptools]
packages = ["udemy_transcripts", "udemy_transcripts.render"]

[tool.pytest.ini_options]
testpaths = ["tests"]
